name: Build Package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Theos (with submodules)
      run: |
        cd /tmp
        rm -rf theos
        git clone --recursive https://github.com/theos/theos.git
        echo "THEOS=/tmp/theos" >> $GITHUB_ENV
        echo "PATH=$PATH:/tmp/theos/bin" >> $GITHUB_ENV

    - name: Verify Theos files
      run: |
        echo "THEOS=$THEOS"
        ls -la /tmp/theos/makefiles/common.mk /tmp/theos/makefiles/tweak.mk /tmp/theos/makefiles/aggregate.mk

    - name: Install dpkg for packaging
      run: brew install dpkg

    - name: Make clean
      run: THEOS=/tmp/theos make clean

    - name: Make package
      run: |
        THEOS=/tmp/theos make package
        ls -la packages/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: packages/