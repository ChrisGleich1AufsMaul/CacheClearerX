name: Build Package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev debhelper

    - name: Set up Theos
      run: |
        cd /tmp
        git clone https://github.com/theos/theos.git
        echo "THEOS=/tmp/theos" >> $GITHUB_ENV
        echo "PATH=$PATH:/tmp/theos/bin" >> $GITHUB_ENV

    - name: Make clean
      run: THEOS=/tmp/theos make clean

    - name: Make package
      run: |
        THEOS=/tmp/theos make package
        ls -la packages/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: packages/
