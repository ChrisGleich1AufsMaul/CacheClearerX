name: Build Package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Theos (mit Submodules)
      run: |
        cd /tmp
        rm -rf theos
        git clone --recursive https://github.com/theos/theos.git
        echo "THEOS=/tmp/theos" >>
        echo "PATH=$PATH:/tmp/theos/bin" >> $GITHUB_ENV

    - name: Verify Theos Makefiles
      run: |
        if [ ! -f "$THEOS/makefiles/common.mk" ]; then
          echo "❌ Theos Makefiles
          exit 1
        else
          echo "✅ Theos Makefiles gefunden"
        fi

    - name: Install dpkg for packa
      run: brew install dpkg

    - name: Make clean
      run: THEOS=/tmp/theos make c

    - name: Make package
      run: |
        THEOS=/tmp/theos make pack
        ls -la packages/

    - name: Upload artifact
      uses: actions/upload-artifact
      with:
        name: package
        path: packages/